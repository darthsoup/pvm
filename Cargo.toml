[package]
name = "pvm"
version = "0.2.0"
edition = "2024"
description = "PHP Version Manager — cross-platform PHP switcher inspired by NVM/fnm"
repository = "https://github.com/darthsoup/pvm"
license = "MIT"

[[bin]]
name = "pvm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
colored = "3"
which = "8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
