[package]
name = "pvm"
version = "0.2.0"
edition = "2024"
description = "PHP Version Manager — cross-platform PHP switcher inspired by NVM/fnm"
repository = "https://github.com/darthsoup/pvm"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "pvm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
colored = "3"
which = "8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
dialoguer = { version = "0.12", default-features = false }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5"

[dev-dependencies]
assert_cmd = "2"
predicates = { version = "3", default-features = false }
